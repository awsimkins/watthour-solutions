    <style>
        :root {

        .summary-brand-name {

        @media (max-width: 720px) {
            .summary-field-groups { grid-template-columns: 1fr; }

        .summary-field-group {

            text-transform: uppercase;
            letter-spacing: 0.04em;

            font-size: 0.7rem;

        .summary-high-note-line {

            line-height: 1.5;
            margin-bottom: 0.35rem;
        }
        .summary-high-note-line:last-child { margin-bottom: 0; }
        .summary-kv { display: grid; grid-template-columns: minmax(9.5rem, 34%) 1fr; gap: 0.4rem 0.85rem; font-size: 0.8125rem; }
        .summary-kv dt { color: var(--report-muted); font-weight: 600; }
        .summary-kv dd { color: var(--report-ink); margin: 0; word-break: break-word; }
        .summary-notes-block { margin-top: 1rem; }
        .summary-notes-panel .report-heading-section {
            margin-bottom: 0.5rem;
        }
        .summary-section-actions {
            display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 1rem; padding-top: 0.75rem;
            border-top: 1px dashed #e2e8f0;
        }
        .summary-section-actions .wsapp-report-action { min-height: 2.15rem; font-size: 0.75rem; padding: 0.35rem 0.75rem; }
        .report-toolbar-groups { display: flex; flex-direction: column; gap: 0.5rem; width: 100%; }
        .report-toolbar-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.35rem; }
        .report-toolbar-label {
            font-size: 0.625rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
            color: #64748b; min-width: 4.25rem; text-align: right;
        }
        .report-toolbar-action-sm { min-height: 2.15rem !important; padding: 0.35rem 0.7rem !important; font-size: 0.75rem !important; }

            .report-technical-summary::before, #report-toast { transition: none; }
        }
        @page {
            margin: 0.45in 0.5in 0.4in 0.5in;
            size: letter;
        }
        @media print {
            .report-charts-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; }

            body { background: #fff !important; }
            main { padding: 0 !important; max-width: none !important; }
            .wsapp-report-card { box-shadow: none !important; border: 0 !important; }
            .report-section-nav { display: none !important; }
            .report-technical-details { border: 0; padding: 0; }
            .report-technical-details:not([open]) .report-technical-body { display: block !important; }
            .report-technical-summary { display: none !important; }
            .report-document-summary { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
            body.print-target-summary .report-document-full,
            body.print-target-summary .report-document-charts { display: none !important; }
            body.print-target-full .report-document-summary,
            body.print-target-full .report-document-charts { display: none !important; }
            body.print-target-charts .report-document-summary,
            body.print-target-charts .report-document-full { display: none !important; }
            body.print-target-both .report-document-summary { page-break-after: always; break-after: page; }
            body.print-target-section .report-document-summary,
            body.print-target-section .report-document-charts { display: none !important; }
            body.print-target-section #report-document-full > .report-full-intro,
            body.print-target-section #report-document-full > .report-section-nav,
            body.print-target-section #report-document-full > .report-meta-footer { display: none !important; }

            body.print-target-section .print-focus { border: 0; padding: 0; background: #fff; }
            body.print-target-section .print-focus .report-technical-body { display: block !important; }
            body.print-target-section .print-focus .report-technical-summary { display: none !important; }
            /* One-page Test Summary — compact layout for Print → Save as PDF */
            body.print-target-summary #section-summary {
                break-inside: avoid;
                page-break-inside: avoid;
            }
            body.print-target-summary .summary-logo-large {
                width: 3.25rem;
                height: 3.25rem;
            }
            body.print-target-summary .summary-letterhead-grid {
                margin-bottom: 0.4rem;
                gap: 0.25rem 0.5rem;

            body.print-target-summary .summary-party-address,

        .pdf-capture-content.summary-one-page .summary-logo-large { width: 3.25rem; height: 3.25rem; }

        .pdf-capture-content.summary-one-page .report-note-info { font-size: 0.65rem; line-height: 1.3; }

<body>

    <div id="report-toast" class="report-toast-hidden no-print" role="status" aria-live="polite" aria-atomic="true"></div>

    <header class="wsapp-report-page-header wsapp-report-header report-page-header text-white shadow-md no-print">
        <div class="report-page-header-brand">
            <img src="../../shared/assets/logo.png" alt="Watthour Solutions logo" class="report-page-header-logo" onerror="this.style.display='none'">
            <div>
                <div class="report-page-header-title">
                    <i class="fa-solid fa-file-lines" style="color:#a7f3d0" aria-hidden="true"></i>
                    <span>Meter Test Report</span>
                </div>
                <div class="report-page-header-sub">Client summary — readable for office staff &amp; members</div>
            </div>
        </div>
        <button type="button" id="btn-load-json" class="wsapp-report-action report-page-load-btn" aria-label="Load report from JSON file">
            <i class="fa-solid fa-file-import" aria-hidden="true"></i> Load JSON
        </button>
    </header>

    <main class="report-page-main">
        <div class="wsapp-report-card report-page-card">
            <div id="test-report-host" class="report-host">
                <div class="report-page-loading">Loading report…</div>
            </div>
        </div>
        <p class="wsapp-visual-footnote report-page-footnote no-print">
            Standalone page — loads the active field report from localStorage or <strong>Load JSON</strong>.
        </p>
    </main>

    <footer class="wsapp-report-toolbar no-print" style="flex-shrink:0;position:sticky;bottom:0;z-index:20">
        <div style="max-width:56rem;margin:0 auto;padding:0.75rem 1rem">
            <div id="toolbar-group-main" class="report-toolbar-row">
                <button type="button" id="btn-print" class="wsapp-report-action report-toolbar-action-sm report-toolbar-btn-print" aria-label="Print report — use Save as PDF for clients">
                    <i class="fa-solid fa-print" aria-hidden="true"></i> <span id="btn-print-label">Print</span>
                </button>
                <button type="button" id="btn-share" class="wsapp-report-action report-toolbar-action-sm report-toolbar-btn-share" aria-label="Share report">
                    <i class="fa-solid fa-share-nodes" aria-hidden="true"></i> Share
                </button>
                <button type="button" id="btn-download" class="wsapp-report-action report-toolbar-action-sm report-toolbar-btn-download" aria-label="Download report file">
                    <i class="fa-solid fa-download" aria-hidden="true"></i> <span id="btn-download-label">Download</span>
                </button>
                <button type="button" id="btn-close" class="wsapp-report-action report-toolbar-action-sm report-toolbar-btn-close" aria-label="Close report">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i> Close
                </button>
            </div>
        </div>
    </footer>

    <script src="../../shared/scripts/wsapp-paths.js"></script>
    <script src="../../shared/assets/html2pdf.bundle.min.js"></script>
    <script src="../../shared/scripts/wsapp-calculations.js"></script>
    <script src="../../shared/scripts/wsapp-utility-profiles.js"></script>
    <script src="../../shared/scripts/wsapp-visual-bridge.js"></script>
    <script src="../../companions/charts/scripts/wsapp-chart-bundle.js"></script>
    <script src="scripts/wsapp-test-report-import.js"></script>
    <script src="scripts/wsapp-test-report-export.js"></script>
    <script src="scripts/wsapp-test-report.js"></script>
</body>
